name: SLE — Criterion coverage

on:
  pull_request:
  push:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify criterion coverage
        run: python tooling/ci/scripts/criterion_coverage.py --specs-dir docs/specs --tests-dir tests
